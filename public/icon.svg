<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad)"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="80" fill="#ffffff" opacity="0.1"/>
  
  <!-- Dice -->
  <g transform="translate(100, 100) scale(0.8)">
    <!-- Dice body -->
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="white"/>
    
    <!-- Dots -->
    <circle cx="-20" cy="-20" r="8" fill="#4F46E5"/>
    <circle cx="20" cy="20" r="8" fill="#4F46E5"/>
    <circle cx="-20" cy="20" r="8" fill="#4F46E5"/>
    <circle cx="20" cy="-20" r="8" fill="#4F46E5"/>
    <circle cx="0" cy="0" r="8" fill="#4F46E5"/>
  </g>
</svg> 